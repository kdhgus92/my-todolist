<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif KR', Georgia, serif; }
      .sans  { font-family: 'Pretendard', -apple-system, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- App background (color-bg token) -->
  <rect x="0" y="0" width="960" height="620" fill="#F5F3EE"/>

  <!-- ===================== Header / Navigation ===================== -->
  <rect x="0" y="0" width="960" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="960" y2="56" stroke="#E4E0D6" stroke-width="1"/>

  <text x="24" y="34" class="serif" font-size="18" font-weight="700" fill="#1F1E1C">my-todolist</text>

  <!-- nav: 할일 목록 (active) -->
  <text x="360" y="34" class="sans" font-size="14" font-weight="600" fill="#1F1E1C">할일 목록</text>
  <rect x="358" y="40" width="60" height="2" fill="#D97706"/>

  <!-- nav: 마이페이지 -->
  <text x="452" y="34" class="sans" font-size="14" font-weight="500" fill="#6B685F">마이페이지</text>

  <!-- logout (secondary/outline button) -->
  <rect x="856" y="14" width="80" height="28" rx="14" fill="#FFFFFF" stroke="#D6D1C4" stroke-width="1"/>
  <text x="896" y="32" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#2B2A28">로그아웃</text>

  <!-- ===================== Filter bar ===================== -->
  <rect x="0" y="56" width="960" height="56" fill="#F5F3EE"/>
  <line x1="0" y1="112" x2="960" y2="112" stroke="#E4E0D6" stroke-width="1"/>

  <text x="24" y="90" class="sans" font-size="13" font-weight="500" fill="#6B685F">카테고리</text>
  <rect x="88" y="72" width="120" height="32" rx="16" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>
  <text x="104" y="92" class="sans" font-size="13" fill="#2B2A28">전체</text>
  <path d="M 190 86 l 5 5 l 5 -5" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="232" y="90" class="sans" font-size="13" font-weight="500" fill="#6B685F">상태</text>
  <rect x="284" y="72" width="120" height="32" rx="16" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>
  <text x="300" y="92" class="sans" font-size="13" fill="#2B2A28">전체</text>
  <path d="M 386 86 l 5 5 l 5 -5" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 카테고리 관리 (secondary) -->
  <rect x="796" y="72" width="140" height="32" rx="16" fill="#FFFFFF" stroke="#D6D1C4" stroke-width="1"/>
  <text x="866" y="92" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#2B2A28">+ 카테고리 관리</text>

  <!-- ===================== Action row ===================== -->
  <rect x="0" y="112" width="960" height="52" fill="#F5F3EE"/>
  <line x1="0" y1="164" x2="960" y2="164" stroke="#E4E0D6" stroke-width="1"/>
  <!-- 할일 등록 (primary) -->
  <rect x="820" y="122" width="116" height="32" rx="16" fill="#1F1E1C"/>
  <text x="878" y="142" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">+ 할일 등록</text>

  <!-- ===================== Todo list ===================== -->
  <!-- Row 1: 알고리즘 과제 제출 / 과제 / 기한초과 -->
  <g>
    <rect x="24" y="184" width="912" height="64" rx="10" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>
    <rect x="44" y="207" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D6D1C4" stroke-width="1"/>
    <text x="80" y="211" class="sans" font-size="15" font-weight="400" fill="#2B2A28">알고리즘 과제 제출</text>
    <rect x="80" y="222" width="46" height="18" rx="6" fill="#F0EDE6"/>
    <text x="103" y="235" text-anchor="middle" class="sans" font-size="11" fill="#6B685F">과제</text>
    <text x="440" y="221" class="sans" font-size="13" fill="#6B685F">2026-08-20 ~ 2026-08-27</text>
    <rect x="640" y="206" width="70" height="24" rx="6" fill="#FBE9E7"/>
    <text x="675" y="222" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#C0392B">기한초과</text>
    <!-- edit icon -->
    <g transform="translate(760,206)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22 L2 17 L15 4 a2.5 2.5 0 0 1 4 4 L6 21 Z"/>
    </g>
    <!-- delete icon -->
    <g transform="translate(800,206)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6 H21 M8 6 V4 a2 2 0 0 1 2 -2 h4 a2 2 0 0 1 2 2 V6 M6 6 L7 22 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 L21 6"/>
    </g>
  </g>

  <!-- Row 2: 팀플 회의 준비 / 과제 / 진행중 -->
  <g>
    <rect x="24" y="256" width="912" height="64" rx="10" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>
    <rect x="44" y="279" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D6D1C4" stroke-width="1"/>
    <text x="80" y="283" class="sans" font-size="15" font-weight="400" fill="#2B2A28">팀플 회의 준비</text>
    <rect x="80" y="294" width="46" height="18" rx="6" fill="#F0EDE6"/>
    <text x="103" y="307" text-anchor="middle" class="sans" font-size="11" fill="#6B685F">과제</text>
    <text x="440" y="293" class="sans" font-size="13" fill="#6B685F">2026-08-25 ~ 2026-08-30</text>
    <rect x="640" y="278" width="70" height="24" rx="6" fill="#FDECD1"/>
    <text x="675" y="294" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#B45309">진행중</text>
    <g transform="translate(760,278)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22 L2 17 L15 4 a2.5 2.5 0 0 1 4 4 L6 21 Z"/>
    </g>
    <g transform="translate(800,278)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6 H21 M8 6 V4 a2 2 0 0 1 2 -2 h4 a2 2 0 0 1 2 2 V6 M6 6 L7 22 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 L21 6"/>
    </g>
  </g>

  <!-- Row 3: 아르바이트 스케줄 확정 / 아르바이트 / 완료 (checked, strikethrough) -->
  <g>
    <rect x="24" y="328" width="912" height="64" rx="10" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>
    <rect x="44" y="351" width="18" height="18" rx="4" fill="#D97706"/>
    <path d="M 48 360 l 4 4 l 8 -9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="355" class="sans" font-size="15" font-weight="400" fill="#6B685F" text-decoration="line-through">아르바이트 스케줄 확정</text>
    <rect x="80" y="366" width="70" height="18" rx="6" fill="#F0EDE6"/>
    <text x="115" y="379" text-anchor="middle" class="sans" font-size="11" fill="#6B685F">아르바이트</text>
    <text x="440" y="365" class="sans" font-size="13" fill="#6B685F">2026-08-10 ~ 2026-08-15</text>
    <rect x="640" y="350" width="70" height="24" rx="6" fill="#E4F1E8"/>
    <text x="675" y="366" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#2F7D4F">완료</text>
    <g transform="translate(760,350)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22 L2 17 L15 4 a2.5 2.5 0 0 1 4 4 L6 21 Z"/>
    </g>
    <g transform="translate(800,350)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6 H21 M8 6 V4 a2 2 0 0 1 2 -2 h4 a2 2 0 0 1 2 2 V6 M6 6 L7 22 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 L21 6"/>
    </g>
  </g>

  <!-- Row 4: 여름 특강 신청 / 기본 / 시작전 -->
  <g>
    <rect x="24" y="400" width="912" height="64" rx="10" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>
    <rect x="44" y="423" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D6D1C4" stroke-width="1"/>
    <text x="80" y="427" class="sans" font-size="15" font-weight="400" fill="#2B2A28">여름 특강 신청</text>
    <rect x="80" y="438" width="46" height="18" rx="6" fill="#F0EDE6"/>
    <text x="103" y="451" text-anchor="middle" class="sans" font-size="11" fill="#6B685F">기본</text>
    <text x="440" y="437" class="sans" font-size="13" fill="#6B685F">2026-09-01 ~ 2026-09-05</text>
    <rect x="640" y="422" width="70" height="24" rx="6" fill="#EDEAE2"/>
    <text x="675" y="438" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#6B685F">시작전</text>
    <g transform="translate(760,422)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22 L2 17 L15 4 a2.5 2.5 0 0 1 4 4 L6 21 Z"/>
    </g>
    <g transform="translate(800,422)" stroke="#6B685F" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6 H21 M8 6 V4 a2 2 0 0 1 2 -2 h4 a2 2 0 0 1 2 2 V6 M6 6 L7 22 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 L21 6"/>
    </g>
  </g>

  <!-- footer note -->
  <text x="480" y="500" text-anchor="middle" class="sans" font-size="12" fill="#6B685F">(조건에 맞는 항목이 없을 경우 "표시할 할일이 없습니다." 안내 문구 표시)</text>

  <!-- caption -->
  <text x="480" y="600" text-anchor="middle" class="sans" font-size="11" fill="#6B685F">SC-03 할일 목록 — docs/4-wireframe.md 4.3절 × docs/9-style.md 스타일 토큰 적용 목업</text>
</svg>
